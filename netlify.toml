[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # NODE_ENV holds a common word ("production") and the code only references
  # JWT_SECRET/MONGO_URI via process.env, so their values are not hardcoded.
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,JWT_SECRET,MONGO_URI"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
